    function aiproxyDefaultConfigPath() {
      return state.aiproxy.defaultConfig || state.configPath || 'config.yaml';
    }

    function renderAiproxyConfigOptions(currentConfig = '') {
      const list = $('aiproxyConfigOptions');
      if (!list) return;
      const values = [
        aiproxyDefaultConfigPath(),
        currentConfig,
        ...(state.aiproxy.configFiles || []).map(item => item.path || item.name || '')
      ].map(value => String(value || '').trim()).filter(Boolean);
      const unique = [...new Set(values)];
      list.innerHTML = unique.map(value => `<option value="${esc(value)}"></option>`).join('');
    }

    function aiproxyServiceAddress(item = null) {
      if (item?.url) return item.url;
      const listen = String(item?.listen || '127.0.0.1').trim() || '127.0.0.1';
      const port = Number(item?.port || 18006);
      const host = listen.includes(':') && !listen.startsWith('[') ? `[${listen}]` : listen;
      return `http://${host}:${Number.isInteger(port) ? port : 18006}`;
    }

    function parseAiproxyServiceAddress(raw) {
      const text = String(raw || '').trim() || 'http://127.0.0.1:18006';
      const withScheme = /^https?:\/\//i.test(text) ? text : `http://${text}`;
      let url;
      try {
        url = new URL(withScheme);
      } catch (_err) {
        throw new Error('服务地址格式不正确');
      }
      if (url.protocol !== 'http:') throw new Error('服务地址只支持 http://');
      const host = url.hostname.replace(/^\[(.*)\]$/, '$1');
      const port = Number(url.port || 18006);
      if (!host) throw new Error('服务地址缺少主机');
      if (!Number.isInteger(port) || port < 1 || port > 65535) throw new Error('服务地址端口必须是 1-65535');
      const loopbackHosts = ['127.0.0.1', 'localhost', '::1', '[::1]'];
      const listen = loopbackHosts.includes(host) ? '127.0.0.1' : '0.0.0.0';
      const normalizedHost = host.includes(':') ? `[${host}]` : host;
      return { listen, port, url: `${url.protocol}//${normalizedHost}:${port}` };
    }

    function openAiproxyEditor(item = null) {
      const editor = $('aiproxyEditor');
      if (!editor) return;
      state.editingAiproxyId = item?.id || 'aiproxy';
      const name = item?.name || item?.service || 'AIProxy';
      $('aiproxyEditorTitle').textContent = `编辑 ${name}`;
      $('aiproxyAddress').value = aiproxyServiceAddress(item);
      renderAiproxyConfigOptions(item?.config || '');
      $('aiproxyConfig').value = item?.config || aiproxyDefaultConfigPath();
      const hint = $('aiproxyEditorHint');
      if (hint) hint.textContent = `固定使用 ${item?.service || 'aiproxy.service'}；服务职责参数不可修改，保存后只重启当前通道。`;
      editor.hidden = false;
      $('aiproxyAddress').focus();
    }

    function closeAiproxyEditor() {
      const editor = $('aiproxyEditor');
      if (editor) editor.hidden = true;
      state.editingAiproxyId = '';
    }

    function collectAiproxyEditor() {
      const address = parseAiproxyServiceAddress($('aiproxyAddress')?.value);
      const config = String($('aiproxyConfig')?.value || aiproxyDefaultConfigPath()).trim();
      if (!config) throw new Error('配置 YAML 必填');
      if (!/\.ya?ml$/i.test(config)) throw new Error('配置文件必须是 .yaml 或 .yml');
      const source = (state.aiproxy.items || []).find(item => item.id === state.editingAiproxyId);
      if (!source) throw new Error('AIProxy 实例不存在，请刷新后重试');
      return {
        id: source.id,
        service: source.service,
        name: source.name,
        listen: address.listen,
        port: address.port,
        url: address.url,
        config,
        verbose: false
      };
    }

    async function saveAiproxyEditor() {
      const item = collectAiproxyEditor();
      $('serverState').textContent = 'AIProxy 服务保存并重启中';
      const data = await api('/aiproxy', { method: 'POST', body: JSON.stringify({ item }) });
      closeAiproxyEditor();
      await loadAiproxyServices();
      await loadAll();
      setAiproxyLog(data);
    }

    function setAiproxyLog(data) {
      const failures = [];
      if (data?.returnCode !== 0) failures.push('服务重启失败');
      if (data?.appSync?.error) failures.push('Codex 配置同步失败');
      if (data?.claudeFunctions?.error || data?.claudeFunctions?.ok === false) failures.push('Claude Code 函数同步失败');
      if (failures.length) {
        $('serverState').textContent = failures.join('；');
        return;
      }
      const reloadHint = data?.claudeFunctions?.changed || data?.claudeFunctions?.sourceAdded
        ? '；Claude Code 函数已更新，当前终端请执行 source ~/.bashrc'
        : '';
      $('serverState').textContent = `AIProxy 操作完成；Codex 与 Claude Code 配置已同步${reloadHint}`;
    }

    async function loadAiproxyServices() {
      try {
        const data = await api('/aiproxy');
        state.aiproxy = data;
        renderAiproxy();
        const summary = data.summary || {};
        $('serverState').textContent = `AIProxy 已刷新：${Number(summary.healthy || 0) > 0 ? '健康' : '异常'}`;
        return data;
      } catch (err) {
        state.aiproxy = { items: [], error: err.message };
        renderAiproxy();
        throw err;
      }
    }

    document.addEventListener('click', async (event) => {
      const target = event.target.closest('button');
      if (!target) return;
      try {
        if (target.classList.contains('tab')) {
          const nextTab = target.dataset.tab || 'config';
          if (state.tab === nextTab) {
            await loadAll();
            return;
          }
          setActiveTab(nextTab, { push: true });
          await loadAll();
        } else if (target.id === 'reloadBtn') {
          window.location.reload();
        } else if (target.id === 'addProviderBtn') {
          beginProviderDraft({ name: `provider-${state.providers.length + 1}`, base_url: 'https://example.com/v1', api_mode: 'codex_responses', enabled: true });
        } else if (target.hasAttribute('data-edit-provider')) {
          const index = Number(target.dataset.editProvider);
          const provider = state.providers[index];
          if (state.selectedProvider === index) {
            dropSelectedProviderDraft();
          } else {
            dropSelectedProviderDraft();
            state.selectedProvider = state.providers.indexOf(provider);
          }
          renderProviders();
        } else if (target.hasAttribute('data-clone-provider')) {
          const clone = JSON.parse(JSON.stringify(providerForPersist(state.providers[Number(target.dataset.cloneProvider)])));
          clone.name = `${clone.name}-copy`;
          beginProviderDraft(clone);
        } else if (target.hasAttribute('data-toggle-provider')) {
          const index = Number(target.dataset.toggleProvider);
          moveProviderAfterToggle(index);
          await persistProviders();
          await loadAll();
        } else if (target.id === 'applyProviderBtn') {
          const provider = collectProviderEditor();
          if (!provider.name || !provider.base_url) throw new Error('名称和 Base URL 必填');
          const current = state.providers[state.selectedProvider];
          const maxNo = regularProviderCount() + (isPinnedProvider(current) && !isPinnedProvider(provider) ? 1 : 0);
          upsertProviderAtNo(provider, providerTargetNo(maxNo));
          await persistProviders();
          await loadAll();
        } else if (target.id === 'providerKeepaliveBtn') {
          await toggleProviderKeepalive();
        } else if (target.id === 'saveProviderKeepaliveBtn') {
          await saveProviderKeepaliveParameters();
        } else if (target.id === 'providerPinnedBtn') {
          await toggleProviderPinnedImmediately();
        } else if (target.hasAttribute('data-delete-provider')) {
          const index = Number(target.dataset.deleteProvider);
          const providerName = state.providers[index]?.name || ('#' + (index + 1));
          if (!confirm('删除 Provider ' + providerName + '？')) return;
          const wasDraft = !!state.providers[index]?.__draft;
          state.providers.splice(index, 1);
          if (state.selectedProvider === index) {
            state.selectedProvider = -1;
          } else if (state.selectedProvider > index) {
            state.selectedProvider -= 1;
          }
          if (wasDraft) {
            renderProviders();
          } else {
            await persistProviders();
            await loadAll();
          }
        } else if (target.id === 'addModelBtn') {
          $('modelRows').insertAdjacentHTML('beforeend', modelRowHtml({ name: '', context: '', effort: '' }, Date.now()));
        } else if (target.id === 'fetchProviderModelsBtn') {
          const provider = collectProviderEditor();
          $('modelFetchStatus').textContent = '正在获取模型...';
          const data = await api('/providers/models', { method: 'POST', body: JSON.stringify({ provider }) });
          renderModelChoices(data.models || []);
          $('modelFetchStatus').textContent = `获取到 ${data.count || 0} 个模型，耗时 ${data.latencyMs || 0}ms`;
        } else if (target.id === 'addSelectedModelsBtn') {
          addFetchedModelsToRows();
        } else if (target.hasAttribute('data-remove-model')) {
          target.closest('[data-model-row]')?.remove();
        } else if (target.id === 'exportConfigBtn') {
          const res = await fetch('/config/export', { headers: { 'Accept': 'application/x-yaml' } });
          const text = await res.text();
          if (!res.ok) throw new Error(text || res.statusText);
          const blob = new Blob([text], { type: 'application/x-yaml' });
          const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'config.yaml' });
          a.click();
          URL.revokeObjectURL(a.href);
        } else if (target.id === 'importConfigBtn') {
          $('importConfigFile').click();
        } else if (target.id === 'saveCompactPercentBtn') {
          await saveCompactPercent();
        } else if (target.id === 'cancelAiproxyEditorBtn') {
          closeAiproxyEditor();
        } else if (target.id === 'saveAiproxyEditorBtn') {
          await saveAiproxyEditor();
        } else if (target.hasAttribute('data-edit-aiproxy')) {
          const item = state.aiproxy.items?.[Number(target.dataset.editAiproxy)];
          openAiproxyEditor(item || null);
        } else if (target.dataset.aiproxyAction) {
          const data = await api('/aiproxy/control', { method: 'POST', body: JSON.stringify({ id: target.dataset.aiproxyId, action: target.dataset.aiproxyAction }) });
          await loadAiproxyServices();
          setAiproxyLog(data);
        }
      } catch (err) {
        $('serverState').textContent = err.message;
        alert(err.message);
      }
    });

    $('headerPreset').addEventListener('change', updateCustomUaInput);
    $('providerMode').addEventListener('change', updateCustomEndpointInput);
    $('providerName').addEventListener('input', updateRetryDefaultsForProviderName);
    $('providerStreamMaxRetries').addEventListener('input', () => { $('providerStreamMaxRetries').dataset.autoDefault = '0'; });
    $('autoCompactPercent').addEventListener('input', markCompactPercentDirty);
    $('autoCompactTokenLimit').addEventListener('input', markCompactPercentDirty);

    $('importConfigFile').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const content = await file.text();
        const parsed = await api('/config/parse', { method: 'POST', body: JSON.stringify({ content }) });
        state.providers = parsed.providers || [];
        state.selectedProvider = -1;
        render();
        await persistProviders();
        await loadAll();
        $('serverState').textContent = `YAML 已导入并保存：${state.providers.length} 个 provider`;
      } catch (err) {
        $('serverState').textContent = err.message;
        alert(err.message);
      } finally {
        event.target.value = '';
      }
    });

    window.addEventListener('popstate', () => {
      setActiveTab(tabFromLocation());
      loadAll().catch(err => {
        $('serverState').textContent = err.message;
      });
    });

    setActiveTab(state.tab);
    loadAll().catch(err => {
      $('serverState').textContent = err.message;
    });
  </script>
</body>
</html>
