<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ai-api 公益服管理</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f6;
      --surface: #ffffff;
      --surface-2: #eef3f1;
      --text: #172026;
      --muted: #66727b;
      --border: #d6dfda;
      --accent: #087f7b;
      --accent-dark: #05615e;
      --danger: #b7323d;
      --warning: #9a6500;
      --success: #237342;
      --code: #101418;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    button, input, textarea, select { font: inherit; }
    button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: #aab8b3; background: #fbfcfc; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .primary:hover:not(:disabled) { border-color: var(--accent-dark); background: var(--accent-dark); }
    button.danger { border-color: var(--danger); background: var(--danger); color: #fff; }
    button.danger:hover:not(:disabled) { border-color: #902631; background: #902631; }
    .danger { color: var(--danger); }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(16px);
    }
    .wrap { width: min(1760px, calc(100% - 28px)); margin: 0 auto; }
    .topbar { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 21px; letter-spacing: 0; }
    h2 { margin: 0; font-size: 16px; letter-spacing: 0; }
    .subtle { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .check-toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-size: 13px; font-weight: 650; white-space: nowrap; }
    .check-toggle input { width: auto; min-height: 0; padding: 0; }
    main { padding: 18px 0 42px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .tab { background: transparent; }
    .tab.active { border-color: var(--accent); background: rgba(8,127,123,.1); color: var(--accent-dark); }
    .view { display: none; }
    .view.active { display: grid; gap: 14px; }
    .panel {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(19, 28, 32, .04);
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .stat { padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    .stat strong { display: block; margin-top: 6px; font-size: 26px; line-height: 1.1; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-items: start; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-6 { grid-column: span 6; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .field { display: grid; gap: 6px; }
    .provider-edit-spaced { margin-top: 10px; }
    .provider-order-row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 10px; align-items: end; }
    .provider-pin-button { width: 100%; }
    .provider-pin-button.active { border-color: var(--accent); background: rgba(8,127,123,.1); color: var(--accent-dark); }
    .provider-save-actions { margin-top: 10px; }
    label { color: #344047; font-size: 13px; font-weight: 650; }
    input, textarea, select {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #cbd5d1;
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(8,127,123,.14);
    }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; min-width: 0; border-collapse: collapse; table-layout: fixed; background: #fff; }
    th, td { min-width: 0; padding: 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; font-size: 13px; overflow-wrap: anywhere; }
    th { background: var(--surface-2); color: #3a464c; font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .ok { border-color: rgba(35,115,66,.25); background: rgba(35,115,66,.08); color: var(--success); }
    .fail { border-color: rgba(183,50,61,.25); background: rgba(183,50,61,.08); color: var(--danger); }
    .warn { border-color: rgba(154,101,0,.28); background: rgba(154,101,0,.08); color: var(--warning); }
    .pending { border-color: rgba(37,99,235,.28); background: rgba(37,99,235,.08); color: #2563eb; }
    .muted { border-color: rgba(102,114,123,.25); background: rgba(102,114,123,.08); color: var(--muted); }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(460px, 520px); gap: 14px; align-items: start; }
    .editor-stack { display: grid; gap: 14px; align-content: start; min-width: 0; }
    .editor { display: grid; gap: 0; min-width: 0; overflow: hidden; }
    .keepalive-card { display: grid; gap: 10px; }
    .keepalive-settings-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
    .keepalive-card.disabled .keepalive-settings-row { opacity: .55; }
    .keepalive-actions { margin-top: 2px; justify-content: flex-start; }
    .keepalive-actions button { min-width: 72px; }
    #modelFetchStatus:empty, #modelRows:empty { display: none; }
    .empty { padding: 24px; border: 1px dashed #b9c5c0; border-radius: 8px; color: var(--muted); text-align: center; background: #fbfcfb; }
    .note { padding: 10px 12px; border: 1px solid #d7c49a; border-radius: 6px; background: #fff8e8; color: #67430b; font-size: 13px; line-height: 1.45; }
    pre { margin: 0; padding: 12px; border-radius: 6px; background: var(--code); color: #ecf2ef; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .row-tools { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
    .row-tools button { min-height: 30px; padding: 0 8px; font-size: 12px; }
    .chain-prompt { width: 120px; min-height: 30px; padding: 4px 8px; font-size: 12px; }
    .row-tools button.danger { border-color: rgba(183,50,61,.45); background: rgba(183,50,61,.06); color: var(--danger); }
    .row-tools button.danger:hover:not(:disabled) { border-color: var(--danger); background: rgba(183,50,61,.1); }
    .save-result { display: grid; gap: 6px; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: #fbfcfb; font-size: 13px; line-height: 1.45; }
    .save-result-row { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
    .save-result-row strong { flex: 0 0 96px; color: #344047; }
    .save-result-row span { min-width: 0; overflow-wrap: anywhere; }
    .mini-table { display: grid; gap: 8px; min-width: 0; }
    .mini-row { display: grid; grid-template-columns: minmax(0, 1fr) 122px 104px 32px; gap: 6px; align-items: center; min-width: 0; }
    .header-row { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1fr) 32px; }
    .mini-row > * { min-width: 0; }
    .mini-row button { min-height: 34px; padding: 0; }
    .toolbar-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .model-picker { display: grid; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: #fbfcfb; max-height: 240px; overflow: auto; }
    .model-choice { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; }
    .model-choice input { min-height: 18px; }
    .service-panel { display: grid; gap: 12px; align-content: start; }
    .service-list { display: grid; gap: 10px; min-width: 0; }
    .service-card { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    .service-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; min-width: 0; }
    .service-title strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .service-health { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .service-meta { display: grid; gap: 5px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .service-meta div { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .service-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; justify-self: end; flex-wrap: wrap; }
    .service-actions button { flex: 0 0 auto; min-height: 30px; padding: 0 8px; font-size: 12px; }
    .aiproxy-editor { display: grid; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: #fbfcfb; }
    .settings-card { display: grid; gap: 10px; }
    .settings-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .setting-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
    .setting-row button { white-space: nowrap; }
    #autoCompactSaveState { margin-top: -4px; }
    .aiproxy-editor-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .aiproxy-editor .actions { justify-content: flex-end; }
    .service-log { max-height: 180px; overflow: auto; }
    @media (max-width: 1180px) {
      .split { grid-template-columns: 1fr; }
    }

    @media (max-width: 980px) {
      .topbar, .panel-head { align-items: stretch; flex-direction: column; }
      .stats { grid-template-columns: 1fr; }
      .span-3, .span-4, .span-6, .span-8, .span-12 { grid-column: 1 / -1; }
      .actions button { flex: 1 1 auto; }
      .mini-row { grid-template-columns: minmax(0, 1fr) 108px 92px 30px; }
      .header-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 30px; }
      .keepalive-settings-row { grid-template-columns: 1fr; align-items: stretch; }
      .provider-order-row { grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <h1>Ai-api 公益服管理</h1>
        <div class="subtle" id="serverState">读取中</div>
      </div>
      <div class="actions">
        <button id="reloadBtn" type="button">刷新</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs">
      <button class="tab active" data-tab="config" type="button">Provider 维护</button>
      <button class="tab" data-tab="aiproxy" type="button">AIProxy 服务</button>
    </nav>

    <section id="config" class="view active">
      <div class="split">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>Provider 维护</h2>
              <div class="subtle">保存会先备份 config.yaml，再原子写入。</div>
            </div>
            <div class="actions">
              <button id="addProviderBtn" type="button">新增</button>
              <button id="exportConfigBtn" type="button">导出 YAML</button>
              <button id="importConfigBtn" type="button">导入 YAML</button>
              <input id="importConfigFile" type="file" accept=".yaml,.yml,application/x-yaml,text/yaml" hidden>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th style="width:52px">No.</th><th style="width:130px">Provider</th><th style="width:270px">Base URL</th><th style="width:150px">Endpoint</th><th style="width:125px;white-space:nowrap">User-Agent</th><th style="width:165px">Model</th><th style="width:220px">Actions</th></tr></thead>
              <tbody id="providerRows"></tbody>
            </table>
          </div>
          <div id="saveResult" hidden></div>
        </section>
        <aside class="editor-stack">
          <section class="panel settings-card">
            <div class="settings-card-head">
              <div>
                <h2>全局上下文压缩</h2>
              </div>
            </div>
            <div class="setting-row">
              <div class="field"><label for="autoCompactPercent">压缩阈值 (%)</label><input id="autoCompactPercent" type="number" min="1" max="95" step="1" value="70"></div>
              <div class="field"><label for="autoCompactTokenLimit">上下文压缩窗口</label><input id="autoCompactTokenLimit" type="number" min="100000" max="1000000" step="1000" value="200000"></div>
              <button id="saveCompactPercentBtn" type="button">保存</button>
            </div>
            <div id="autoCompactSaveState" class="subtle"></div>
          </section>
          <section class="panel editor">
            <div>
              <h2 id="providerEditorTitle">Provider编辑</h2>
            </div>
            <div class="provider-order-row provider-edit-spaced">
              <div class="field"><label for="providerNo">No.</label><input id="providerNo" type="number" min="1" step="1" value="1"></div>
              <div class="field"><button id="providerPinnedBtn" class="provider-pin-button" type="button" aria-label="固定位置" aria-pressed="false">启用置顶</button></div>
            </div>
          <div class="field provider-edit-spaced"><label for="providerName">Provider</label><input id="providerName"></div>
          <div class="field provider-edit-spaced"><label for="providerBaseUrl">Base URL</label><input id="providerBaseUrl" placeholder="https://example.com/v1"></div>
          <div class="field provider-edit-spaced"><label for="providerApiKey">API Key</label><input id="providerApiKey" type="text"></div>
          <div class="field provider-edit-spaced"><label for="providerMode">Endpoint</label><select id="providerMode"><option value="codex_responses">/responses</option><option value="chat_completions">/chat/completions</option><option value="messages">/messages</option><option value="custom_endpoint">自定义</option></select><input id="providerCustomEndpoint" placeholder="/responses" hidden></div>
          <div class="field provider-edit-spaced">
            <label for="headerPreset">User-Agent</label>
            <select id="headerPreset">
              <option value="default">Default</option>
              <option value="codex">Codex</option>
              <option value="claude_code">Claude Code</option>
              <option value="empty">Empty</option>
              <option value="curl">Curl</option>
              <option value="chrome">Chrome</option>
              <option value="custom">Custom</option>
            </select>
            <input id="headerCustomUa" placeholder="Custom User-Agent" hidden>
          </div>
          <div class="field provider-edit-spaced">
            <label>Model</label>
            <div class="toolbar-line"><button id="addModelBtn" type="button">新增模型</button><button id="fetchProviderModelsBtn" type="button">获取模型</button><button id="addSelectedModelsBtn" type="button" hidden>加入选中</button></div>
            <div id="modelFetchStatus" class="subtle"></div>
            <div id="modelChoices" class="model-picker" hidden></div>
            <div id="modelRows" class="mini-table"></div>
          </div>
          <div class="field provider-edit-spaced">
            <label for="providerStreamMaxRetries">Codex stream_max_retries</label>
            <input id="providerStreamMaxRetries" type="number" min="0" max="100" step="1" value="5">
          </div>
            <div class="actions provider-save-actions">
              <button id="applyProviderBtn" class="primary" type="button">保存</button>
            </div>
          </section>
          <section id="providerKeepaliveCard" class="panel keepalive-card disabled">
            <div>
              <h2>抢通保活</h2>
            </div>
            <div id="providerKeepaliveOptions" class="keepalive-settings-row">
              <div class="field">
                <label for="providerKeepaliveConcurrency">并发数</label>
                <input id="providerKeepaliveConcurrency" type="number" min="1" max="50" step="1" value="10">
              </div>
              <div class="field">
                <label for="providerKeepaliveRetryInterval">抢通间隔（秒）</label>
                <input id="providerKeepaliveRetryInterval" type="number" min="1" max="3600" step="1" value="5">
              </div>
              <div class="field">
                <label for="providerKeepaliveInterval">保活间隔（秒）</label>
                <input id="providerKeepaliveInterval" type="number" min="5" max="3600" step="1" value="30">
              </div>
            </div>
            <div class="actions keepalive-actions">
              <button id="saveProviderKeepaliveBtn" type="button">保存</button>
              <button id="providerKeepaliveBtn" class="primary" type="button" aria-pressed="false">启用</button>
            </div>
          </section>
        </aside>
      </div>
    </section>

    <section id="aiproxy" class="view">
      <section class="panel service-panel">
        <div class="panel-head">
          <div>
            <h2>AIProxy 服务状态</h2>
            <div class="subtle">查看当前 AIProxy：systemd 状态、HTTP 响应和启动/停止/重启。</div>
          </div>
        </div>
        <div id="aiproxyPageRows" class="service-list"></div>
        <div id="aiproxyEditor" class="aiproxy-editor" hidden>
          <div class="aiproxy-editor-head">
            <h2 id="aiproxyEditorTitle">编辑 AIProxy</h2>
            <span class="subtle">保存后只重启当前通道。</span>
          </div>
          <div class="grid">
            <div class="field span-6"><label for="aiproxyAddress">服务地址</label><input id="aiproxyAddress" placeholder="http://127.0.0.1:18006"></div>
            <div class="field span-6"><label for="aiproxyConfig">配置 YAML</label><input id="aiproxyConfig" list="aiproxyConfigOptions" placeholder="config.yaml"><datalist id="aiproxyConfigOptions"></datalist></div>
          </div>
          <div id="aiproxyEditorHint" class="subtle">服务职责和 systemd unit 固定不变；保存后只重启当前通道。</div>
          <div class="actions">
            <button id="cancelAiproxyEditorBtn" type="button">取消</button>
            <button id="saveAiproxyEditorBtn" class="primary" type="button">保存并重启</button>
          </div>
        </div>
      </section>

    </section>


  </main>

  <script>
    const TAB_PATHS = { config: '/config', aiproxy: '/aiproxy' };
    const PATH_TABS = { '/': 'config', '/dashboard.html': 'config', '/config': 'config', '/aiproxy': 'aiproxy' };
    const tabFromLocation = () => PATH_TABS[window.location.pathname] || 'config';

    const state = {
      tab: tabFromLocation(),
      providers: [],
      appSync: {},
      customProviders: { codex: { items: [] } },
      settings: { autoCompactPercent: 70, autoCompactTokenLimit: 200000 },
      aiproxy: { items: [] },
      keepalive: { ok: false, providers: {} },
      configPath: 'config.yaml',
      fetchedModels: [],
      selectedProvider: -1,
      lastSaveMessage: '',
      lastSaveDetails: null
    };

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const modelNames = (p) => {
      const m = p.models || p.model;
      const normalize = (item) => {
        if (typeof item === 'string') return item.trim();
        if (item && typeof item === 'object') return String(item.id || item.name || '').trim();
        return String(item ?? '').trim();
      };
      if (typeof m === 'string') return [m.trim()].filter(Boolean);
      if (Array.isArray(m)) return m.map(normalize).filter(Boolean);
      if (m && typeof m === 'object') return Object.keys(m).map(normalize).filter(Boolean);
      return [];
    };
    const statusPill = (ok, text, kind = '') => `<span class="status ${kind || (ok === true ? 'ok' : ok === false ? 'fail' : 'muted')}">${esc(text)}</span>`;
    const CODEX_STREAM_MAX_RETRIES_DEFAULT = 5;
    const KEEPALIVE_CONCURRENCY_DEFAULT = 10;
    const KEEPALIVE_RETRY_INTERVAL_DEFAULT = 5;
    const KEEPALIVE_INTERVAL_DEFAULT = 30;
    const CODEX_RETRY_MAX = 100;
    const api = async (path, options = {}) => {
      const res = await fetch(path, {
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        ...options
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    };

    function setActiveTab(tab, options = {}) {
      const nextTab = TAB_PATHS[tab] ? tab : 'config';
      state.tab = nextTab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === state.tab));
      const nextPath = TAB_PATHS[state.tab] || '/config';
      if (options.push && window.location.pathname !== nextPath) {
        history.pushState({ tab: state.tab }, '', nextPath);
      } else if (options.replace && window.location.pathname !== nextPath) {
        history.replaceState({ tab: state.tab }, '', nextPath);
      }
    }

    async function copyText(text) {
      const value = String(text || '');
      if (!value) throw new Error('没有可复制的内容');
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(value);
        return;
      }
      const textarea = document.createElement('textarea');
      textarea.value = value;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        if (!document.execCommand('copy')) throw new Error('浏览器拒绝复制');
      } finally {
        textarea.remove();
      }
    }

    async function loadAll() {
      $('serverState').textContent = '读取中';
      const [config, aiproxy, keepalive] = await Promise.all([
        api('/config'),
        api('/aiproxy').catch(err => ({ items: [], error: err.message })),
        api('/keepalive').catch(err => ({ ok: false, providers: {}, error: err.message }))
      ]);
      state.providers = config.providers || [];
      ensurePinnedTimestamps(state.providers);
      state.settings = config.settings || { autoCompactPercent: 70, autoCompactTokenLimit: 200000 };
      state.configPath = config.configPath || 'config.yaml';
      sortProvidersByEnabled();
      state.aiproxy = aiproxy;
      state.keepalive = keepalive;
      if (state.selectedProvider >= state.providers.length) state.selectedProvider = -1;
      render();
      startKeepalivePolling();
      const serviceSummary = state.aiproxy.summary ? `，AIProxy${Number(state.aiproxy.summary.healthy || 0) > 0 ? '健康' : '异常'}` : '';
      const saveMessage = state.lastSaveMessage;
      state.lastSaveMessage = '';
      $('serverState').textContent = saveMessage || `已读取 ${state.providers.length} 个 provider${serviceSummary}`;
    }

    let keepaliveTimer = null;

    function keepaliveWatched() {
      return state.providers.some(p => p && p.keepalive === true);
    }

    async function refreshKeepalive() {
      if (!keepaliveWatched()) return;
      try {
        state.keepalive = await api('/keepalive');
      } catch (err) {
        state.keepalive = { ok: false, providers: {}, error: err.message };
      }
      renderProviders();
    }

    function startKeepalivePolling() {
      if (keepaliveTimer) clearInterval(keepaliveTimer);
      keepaliveTimer = null;
      // 只有存在勾选了保活的 provider 才轮询，否则 dashboard 空转打 aiproxy。
      if (!keepaliveWatched()) return;
      keepaliveTimer = setInterval(refreshKeepalive, 15000);
    }

    function render() {
      renderCompactSettings();
      renderProviders();
      renderAiproxy();
    }

    function autoCompactPercentValue(value = state.settings?.autoCompactPercent) {
      const percent = Math.round(Number(value || 70));
      if (!Number.isFinite(percent)) return 70;
      return Math.min(Math.max(percent, 1), 95);
    }

    function autoCompactTokenLimitValue(value = state.settings?.autoCompactTokenLimit) {
      const limit = Math.round(Number(value || 200000));
      if (!Number.isFinite(limit)) return 200000;
      return Math.min(Math.max(limit, 100000), 1000000);
    }

    function renderCompactSettings() {
      const percent = autoCompactPercentValue();
      const tokenLimit = autoCompactTokenLimitValue();
      const percentInput = $('autoCompactPercent');
      const tokenLimitInput = $('autoCompactTokenLimit');
      if (percentInput && document.activeElement !== percentInput) percentInput.value = percent;
      if (tokenLimitInput && document.activeElement !== tokenLimitInput) tokenLimitInput.value = tokenLimit;
    }

    function setCompactSaveState(text = '') {
      const el = $('autoCompactSaveState');
      if (!el) return;
      el.textContent = text;
    }

    function markCompactPercentDirty() {
      const percentInput = $('autoCompactPercent');
      const tokenLimitInput = $('autoCompactTokenLimit');
      if (!percentInput || !tokenLimitInput) return;
      const percent = Number(percentInput.value || 70);
      const tokenLimit = Number(tokenLimitInput.value || 200000);
      if (!Number.isFinite(percent) || !Number.isFinite(tokenLimit)) {
        setCompactSaveState('请输入数字');
        return;
      }
      setCompactSaveState(
        Math.round(percent) === autoCompactPercentValue()
        && Math.round(tokenLimit) === autoCompactTokenLimitValue()
          ? ''
          : '未保存'
      );
    }

    function collectAutoCompactSettings() {
      const percentRaw = Number($('autoCompactPercent')?.value || 70);
      const tokenLimitRaw = Number($('autoCompactTokenLimit')?.value || 200000);
      if (!Number.isFinite(percentRaw)) throw new Error('压缩阈值必须是数字');
      if (!Number.isFinite(tokenLimitRaw)) throw new Error('上下文压缩窗口必须是数字');
      const percent = Math.round(percentRaw);
      const tokenLimit = Math.round(tokenLimitRaw);
      if (percent < 1 || percent > 95) throw new Error('压缩阈值必须在 1-95% 之间');
      if (tokenLimit < 100000 || tokenLimit > 1000000) throw new Error('上下文压缩窗口必须在 100000-1000000 之间');
      return { percent, tokenLimit };
    }

    async function saveCompactPercent() {
      const { percent, tokenLimit } = collectAutoCompactSettings();
      const btn = $('saveCompactPercentBtn');
      if (btn) btn.disabled = true;
      const originalText = btn?.textContent || '';
      try {
        if (btn) btn.textContent = '保存中...';
        setCompactSaveState('保存中...');
        $('serverState').textContent = `正在保存上下文压缩设置 ${percent}% / ${tokenLimit}...`;
        const data = await api('/app-configs/compact-percent', {
          method: 'POST',
          body: JSON.stringify({ autoCompactPercent: percent, autoCompactTokenLimit: tokenLimit })
        });
        state.settings = data.settings || { autoCompactPercent: percent, autoCompactTokenLimit: tokenLimit };
        renderCompactSettings();
        setCompactSaveState('已同步到 Codex 和 Claude Code');
        $('serverState').textContent = `上下文压缩设置已保存：${autoCompactPercentValue(state.settings.autoCompactPercent)}% / ${autoCompactTokenLimitValue(state.settings.autoCompactTokenLimit)}`;
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = originalText || '保存';
        }
      }
    }

    function compactProviderForPersist(provider) {
      const item = { ...(provider || {}) };
      delete item.__draft;
      if (Array.isArray(item.remove_headers) && item.remove_headers.length === 0) delete item.remove_headers;
      if (item.headers && typeof item.headers === 'object' && !Array.isArray(item.headers) && !Object.keys(item.headers).length) delete item.headers;
      if (item.models && typeof item.models === 'object' && !Array.isArray(item.models) && !Object.keys(item.models).length) delete item.models;
      if (item.auth_mode === 'bearer') delete item.auth_mode;
      if (item.pinned !== true) {
        delete item.pinned;
        delete item.pinned_at;
      }
      delete item.request_max_retries;
      // 关闭时保留已保存的非默认参数；Provider 编辑保存不能清掉 Keepalive 独立配置。
      if (item.keepalive !== true) {
        delete item.keepalive;
      }
      ['note', 'api_key', 'key', 'reasoning_effort', 'reasoning', 'anthropic_version'].forEach(key => {
        if (item[key] === '') delete item[key];
      });
      return item;
    }

    function providerRetryValue(provider, key, fallback) {
      const raw = provider?.[key];
      if (raw === undefined || raw === null || raw === '') return fallback;
      const value = Number(raw);
      return Number.isInteger(value) && value >= 0 && value <= CODEX_RETRY_MAX ? value : fallback;
    }

    function hasRetryConfig(provider, key) {
      return provider && provider[key] !== undefined && provider[key] !== null && provider[key] !== '';
    }

    function updateRetryDefaultsForProviderName() {
      const streamInput = $('providerStreamMaxRetries');
      if (streamInput && streamInput.dataset.autoDefault !== '0') streamInput.value = CODEX_STREAM_MAX_RETRIES_DEFAULT;
    }

    function collectRetryInput(id, label, fallback) {
      const raw = String($(id)?.value ?? '').trim();
      if (!raw) return fallback;
      const value = Number(raw);
      if (!Number.isInteger(value) || value < 0 || value > CODEX_RETRY_MAX) {
        throw new Error(`${label} 必须是 0-${CODEX_RETRY_MAX} 之间的整数`);
      }
      return value;
    }

    function collectIntegerInput(id, label, low, high, fallback) {
      const raw = String($(id)?.value ?? '').trim();
      if (!raw) return fallback;
      const value = Number(raw);
      if (!Number.isInteger(value) || value < low || value > high) {
        throw new Error(`${label} 必须是 ${low}-${high} 之间的整数`);
      }
      return value;
    }

    function providerKeepaliveEnabled() {
      return $('providerKeepaliveBtn')?.dataset.enabled === 'true';
    }

    function setProviderKeepaliveEnabled(enabled) {
      const button = $('providerKeepaliveBtn');
      if (!button) return;
      button.dataset.enabled = enabled ? 'true' : 'false';
      button.setAttribute('aria-pressed', enabled ? 'true' : 'false');
      button.textContent = enabled ? '关闭' : '启用';
      button.classList.toggle('primary', !enabled);
      button.classList.toggle('danger', enabled);
      updateKeepaliveOptions();
    }

    function updateKeepaliveOptions() {
      const provider = state.providers[state.selectedProvider];
      const available = !!provider && !provider.__draft;
      const card = $('providerKeepaliveCard');
      const toggleButton = $('providerKeepaliveBtn');
      const saveButton = $('saveProviderKeepaliveBtn');
      if (card) card.classList.toggle('disabled', !available);
      if (toggleButton) toggleButton.disabled = !available;
      if (saveButton) saveButton.disabled = !available;
      for (const id of ['providerKeepaliveConcurrency', 'providerKeepaliveRetryInterval', 'providerKeepaliveInterval']) {
        const input = $(id);
        if (input) input.disabled = !available;
      }
    }

    function collectKeepaliveSettings() {
      return {
        concurrency: collectIntegerInput(
          'providerKeepaliveConcurrency',
          '并发数',
          1,
          50,
          KEEPALIVE_CONCURRENCY_DEFAULT
        ),
        retryInterval: collectIntegerInput(
          'providerKeepaliveRetryInterval',
          '抢通间隔',
          1,
          3600,
          KEEPALIVE_RETRY_INTERVAL_DEFAULT
        ),
        interval: collectIntegerInput(
          'providerKeepaliveInterval',
          '保活间隔',
          5,
          3600,
          KEEPALIVE_INTERVAL_DEFAULT
        )
      };
    }

    function keepaliveSettingsForProvider(provider) {
      return {
        concurrency: Number(provider?.keepalive_concurrency || KEEPALIVE_CONCURRENCY_DEFAULT),
        retryInterval: Number(provider?.keepalive_retry_interval || KEEPALIVE_RETRY_INTERVAL_DEFAULT),
        interval: Number(provider?.keepalive_interval || KEEPALIVE_INTERVAL_DEFAULT)
      };
    }

    function keepaliveSettingsChanged(provider, settings) {
      const saved = keepaliveSettingsForProvider(provider);
      return saved.concurrency !== settings.concurrency
        || saved.retryInterval !== settings.retryInterval
        || saved.interval !== settings.interval;
    }

    function applyKeepaliveResult(provider, data, updateInputs = true) {
      const saved = data?.keepalive || {};
      provider.keepalive = saved.enabled === true;
      provider.keepalive_concurrency = Number(saved.concurrency || KEEPALIVE_CONCURRENCY_DEFAULT);
      provider.keepalive_retry_interval = Number(saved.retryInterval || KEEPALIVE_RETRY_INTERVAL_DEFAULT);
      provider.keepalive_interval = Number(saved.interval || KEEPALIVE_INTERVAL_DEFAULT);
      setProviderKeepaliveEnabled(provider.keepalive);
      if (updateInputs) {
        $('providerKeepaliveConcurrency').value = provider.keepalive_concurrency;
        $('providerKeepaliveRetryInterval').value = provider.keepalive_retry_interval;
        $('providerKeepaliveInterval').value = provider.keepalive_interval;
      }
      renderProviderRows();
      startKeepalivePolling();
    }

    async function toggleProviderKeepalive() {
      const provider = state.providers[state.selectedProvider];
      if (!provider || provider.__draft) throw new Error('请先保存 Provider，再配置 Keepalive');
      const currentlyEnabled = providerKeepaliveEnabled();
      if (!currentlyEnabled) {
        const settings = collectKeepaliveSettings();
        if (keepaliveSettingsChanged(provider, settings)) {
          throw new Error('Keepalive 参数尚未保存，请先点击“保存”');
        }
      }
      const button = $('providerKeepaliveBtn');
      if (button) button.disabled = true;
      try {
        $('serverState').textContent = currentlyEnabled ? '正在关闭 Keepalive' : '正在启用 Keepalive';
        const data = await api('/config/keepalive', {
          method: 'POST',
          body: JSON.stringify({ name: provider.name, enabled: !currentlyEnabled })
        });
        applyKeepaliveResult(provider, data, !currentlyEnabled);
        const restartText = saveRestartText(data.restart);
        $('serverState').textContent = currentlyEnabled
          ? `Keepalive 已关闭${restartText}`
          : `Keepalive 已启用${restartText}`;
      } finally {
        if (button) button.disabled = false;
        updateKeepaliveOptions();
      }
    }

    async function saveProviderKeepaliveParameters() {
      const provider = state.providers[state.selectedProvider];
      if (!provider || provider.__draft) throw new Error('请先保存 Provider，再配置 Keepalive');
      const settings = collectKeepaliveSettings();
      const enabled = providerKeepaliveEnabled();
      const button = $('saveProviderKeepaliveBtn');
      if (button) button.disabled = true;
      try {
        $('serverState').textContent = enabled ? '正在保存并应用 Keepalive 参数' : '正在保存 Keepalive 参数';
        const data = await api('/config/keepalive', {
          method: 'POST',
          body: JSON.stringify({ name: provider.name, ...settings })
        });
        applyKeepaliveResult(provider, data);
        const restartText = saveRestartText(data.restart);
        $('serverState').textContent = enabled
          ? `Keepalive 参数已保存并应用${restartText}`
          : 'Keepalive 参数已保存（当前关闭，未重启）';
      } finally {
        if (button) button.disabled = false;
        updateKeepaliveOptions();
      }
    }

    function providerForPersist(provider) {
      return compactProviderForPersist(provider);
    }

    function isPinnedProvider(provider) {
      return provider?.pinned === true;
    }

    function pinnedAtValue(provider) {
      const value = Number(provider?.pinned_at);
      return Number.isFinite(value) && value > 0 ? value : null;
    }

    function ensurePinnedTimestamps(providers) {
      const base = Date.now();
      providers.forEach((provider, index) => {
        if (isPinnedProvider(provider) && pinnedAtValue(provider) === null) {
          provider.pinned_at = base + index;
        }
      });
    }

    function pinnedProviderCount(providers = state.providers) {
      return providers.filter(isPinnedProvider).length;
    }

    function regularProviderCount(providers = state.providers) {
      return providers.filter(provider => !isPinnedProvider(provider)).length;
    }

    function regularProviderNo(index, providers = state.providers) {
      if (index < 0 || isPinnedProvider(providers[index])) return 0;
      let no = 0;
      for (let i = 0; i <= index && i < providers.length; i += 1) {
        if (!isPinnedProvider(providers[i])) no += 1;
      }
      return no;
    }

    function setProviderPinnedButton(pinned, pinnedAt = '') {
      const button = $('providerPinnedBtn');
      const input = $('providerNo');
      if (button) {
        button.dataset.pinned = pinned ? '1' : '0';
        if (pinned && pinnedAt) button.dataset.pinnedAt = String(pinnedAt);
        else delete button.dataset.pinnedAt;
        button.setAttribute('aria-pressed', pinned ? 'true' : 'false');
        button.textContent = pinned ? '取消置顶' : '启用置顶';
        button.classList.toggle('active', pinned);
      }
      if (input) {
        input.disabled = pinned;
        if (pinned) input.value = '';
        else if (!String(input.value || '').trim()) input.value = '1';
      }
    }

    function providerPinnedFromEditor() {
      return $('providerPinnedBtn')?.dataset.pinned === '1';
    }

    function providerPinnedAtFromEditor() {
      const button = $('providerPinnedBtn');
      const existing = Number(button?.dataset.pinnedAt);
      if (Number.isFinite(existing) && existing > 0) return Math.trunc(existing);
      return Date.now();
    }

    async function toggleProviderPinnedImmediately() {
      if (state.selectedProvider < 0) return;
      const current = state.providers[state.selectedProvider];
      if (current?.__draft) throw new Error('请先保存 Provider，再启用置顶');
      const previousPinned = providerPinnedFromEditor();
      const previousPinnedAt = current?.pinned_at;
      const pinned = !previousPinned;
      const pinnedAt = pinned ? Date.now() : '';
      const button = $('providerPinnedBtn');
      if (button) button.disabled = true;
      try {
        await api('/config/pin', {
          method: 'POST',
          body: JSON.stringify({
            name: current.name,
            pinned,
            pinnedAt
          })
        });
        current.pinned = pinned;
        if (pinned) current.pinned_at = pinnedAt;
        else delete current.pinned_at;
        sortProvidersByEnabled();
        renderProviderRows();
        setProviderPinnedButton(pinned, pinnedAt);
        $('serverState').textContent = pinned
          ? '已启用置顶（AIProxy 未重启）'
          : '已取消置顶（AIProxy 未重启）';
      } catch (error) {
        current.pinned = previousPinned;
        if (previousPinned) current.pinned_at = previousPinnedAt;
        else delete current.pinned_at;
        setProviderPinnedButton(previousPinned, previousPinned ? previousPinnedAt : '');
        throw error;
      } finally {
        if (button) button.disabled = false;
      }
    }

    function dropSelectedProviderDraft() {
      const current = state.providers[state.selectedProvider];
      if (current?.__draft) {
        state.providers.splice(state.selectedProvider, 1);
      }
      state.selectedProvider = -1;
    }

    function beginProviderDraft(provider) {
      dropSelectedProviderDraft();
      const index = isPinnedProvider(provider) ? 0 : pinnedProviderCount();
      state.providers.splice(index, 0, { ...provider, __draft: true });
      state.selectedProvider = index;
      renderProviders();
    }

    function firstDisabledIndex(providers = state.providers) {
      const pinnedCount = pinnedProviderCount(providers);
      const index = providers.slice(pinnedCount).findIndex(provider => provider.enabled === false);
      return index < 0 ? providers.length : pinnedCount + index;
    }

    function sortProvidersByEnabled() {
      const selected = state.providers[state.selectedProvider] || null;
      const pinned = state.providers
        .map((provider, index) => ({ provider, index }))
        .filter(item => isPinnedProvider(item.provider))
        .sort((left, right) => {
          const leftAt = pinnedAtValue(left.provider);
          const rightAt = pinnedAtValue(right.provider);
          if (leftAt !== null && rightAt !== null && leftAt !== rightAt) return leftAt - rightAt;
          if (leftAt !== null && rightAt === null) return -1;
          if (leftAt === null && rightAt !== null) return 1;
          return left.index - right.index;
        })
        .map(item => item.provider);
      const enabled = state.providers.filter(provider => !isPinnedProvider(provider) && provider.enabled !== false);
      const disabled = state.providers.filter(provider => !isPinnedProvider(provider) && provider.enabled === false);
      state.providers = [...pinned, ...enabled, ...disabled];
      state.selectedProvider = selected ? state.providers.indexOf(selected) : -1;
    }

    function providerTargetNo(maxNo) {
      const input = $('providerNo');
      const raw = Number(input?.value || 1);
      const value = Number.isInteger(raw) ? raw : 1;
      return Math.min(Math.max(value, 1), Math.max(maxNo, 1));
    }

    function upsertProviderAtNo(provider, targetNo) {
      const oldIndex = state.selectedProvider;
      const providers = [...state.providers];
      const oldProvider = oldIndex >= 0 ? providers[oldIndex] : null;
      const oldWasPinned = isPinnedProvider(oldProvider);
      if (oldIndex >= 0) providers.splice(oldIndex, 1);
      const pinnedCount = pinnedProviderCount(providers);
      if (isPinnedProvider(provider)) {
        const index = oldWasPinned
          ? Math.min(Math.max(oldIndex, 0), pinnedCount)
          : pinnedCount;
        providers.splice(index, 0, provider);
        state.providers = providers;
        state.selectedProvider = -1;
        return;
      }
      const disabledStart = firstDisabledIndex(providers);
      const regularStart = pinnedCount;
      let index;
      if (provider.enabled === false) {
        index = Math.min(Math.max(regularStart + targetNo - 1, disabledStart), providers.length);
      } else {
        index = Math.min(Math.max(regularStart + targetNo - 1, regularStart), disabledStart);
      }
      providers.splice(index, 0, provider);
      state.providers = providers;
      state.selectedProvider = -1;
    }

    function moveProviderAfterToggle(index) {
      const providers = [...state.providers];
      const provider = providers[index];
      if (!provider) return;
      providers.splice(index, 1);
      provider.enabled = provider.enabled === false;
      if (isPinnedProvider(provider)) {
        providers.splice(index, 0, provider);
        state.providers = providers;
        state.selectedProvider = -1;
        return;
      }
      const insertIndex = firstDisabledIndex(providers);
      providers.splice(insertIndex, 0, provider);
      state.providers = providers;
      state.selectedProvider = -1;
    }

    function preferredAiproxyItem() {
      const items = state.aiproxy?.items || [];
      if (!items.length) return null;
      return items.find(item => String(item.service || '') === 'aiproxy.service')
        || items.find(item => item.health === 'healthy')
        || items[0];
    }

    function aiproxyBaseUrl(item = null) {
      const source = item || preferredAiproxyItem();
      if (!source) return 'http://127.0.0.1:18006';
      if (source.url) return String(source.url).replace(/\/$/, '');
      const port = Number(source.port || 18006);
      let host = String(source.listen || '127.0.0.1').trim() || '127.0.0.1';
      if (['0.0.0.0', '::', '[::]', '*'].includes(host)) host = '127.0.0.1';
      if (host.includes(':') && !host.startsWith('[') && !/^\d+\.\d+\.\d+\.\d+$/.test(host)) host = `[${host}]`;
      return `http://${host}:${Number.isFinite(port) ? port : 18006}`;
    }

    function providerLocalUrl(providerName) {
      return `${aiproxyBaseUrl()}/${encodeURIComponent(String(providerName || '').trim())}/v1`;
    }

    function renderSaveResult() {
      const box = $('saveResult');
      if (!box) return;
      const data = state.lastSaveDetails;
      if (!data) {
        box.hidden = true;
        box.innerHTML = '';
        return;
      }
      box.hidden = false;
      box.className = 'save-result';
      box.innerHTML = saveResultHtml(data);
    }

    function saveResultHtml(data) {
      const rows = [];
      const row = (label, value, ok = null) => {
        const icon = ok === true ? '✅ ' : ok === false ? '⚠️ ' : '';
        rows.push(`<div class="save-result-row"><strong>${esc(label)}</strong><span>${icon}${esc(value || '-')}</span></div>`);
      };
      row('保存结果', data.ok ? '配置已保存并完成原子写入' : '保存失败', !!data.ok);
      row('配置备份', data.backup ? `已创建：${data.backup}` : '没有旧配置文件可备份', data.backup ? true : null);
      row('Claude 函数', claudeFunctionsSummary(data.claudeFunctions), data.claudeFunctions?.ok !== false);
      row('应用同步', appSyncSummary(data.appSync), !data.appSync?.error);
      row('AIProxy 重启', restartSummary(data.restart), data.restart?.ok !== false);
      if (data.warnings?.length) row('保存警告', data.warnings.join('；'), false);
      return rows.join('');
    }

    function claudeFunctionsSummary(result) {
      if (!result) return '未返回同步结果';
      if (result.ok === false || result.error) return `同步失败：${result.error || '未知错误'}`;
      const functions = Array.isArray(result.functions) ? result.functions : [];
      if (!functions.length) return '没有已启用的 /messages Provider，无需生成函数';
      const names = functions.map(item => {
        const modelCount = Array.isArray(item.models) ? item.models.length : 0;
        const defaultModel = item.defaultModel || '未配置模型';
        return `${item.function}（默认 ${defaultModel}，${modelCount} 个模型）`;
      });
      const parts = [
        `${result.changed ? '已更新' : '无需更新'} ${result.path || 'claude-code-functions.sh'}`,
        names.join('、')
      ];
      if (result.sourceAdded) parts.push(`已加入 ~/.bashrc；当前终端执行 ${result.reloadCommand || 'source ~/.bashrc'} 后生效`);
      return parts.join('；');
    }

    function appSyncSummary(appSync) {
      if (!appSync) return '未返回同步结果';
      if (appSync.error) return `同步失败：${appSync.error}`;
      if (appSync.needed === false) return `无需同步（${appSync.reason || '配置未变化'}，${appSync.proxyBase || ''}）`;
      const parts = [];
      if (appSync.proxyBase) parts.push(`代理地址 ${appSync.proxyBase}`);
      const compactPercent = appSync.settings?.autoCompactPercent || appSync.codex?.autoCompactPercent;
      if (compactPercent) parts.push(`上下文压缩 ${compactPercent}%`);
      if (appSync.codex) parts.push(`Codex ${appSync.codex.providers ?? 0} 个 provider，profiles ${(appSync.codex.profiles || []).length} 个，备份 ${appSync.codex.backup ? '已创建' : '无'}`);
      return parts.join('；') || '已同步';
    }

    function restartSummary(restart) {
      if (!restart) return '未返回重启结果';
      if (restart.configCheck?.ok === false) return `未重启：配置检查失败${restart.configCheck.output ? '：' + restart.configCheck.output : ''}`;
      if (restart.ok === false) return restart.skipped || '自动重启失败，请到 AIProxy 服务页查看详情';
      const manual = restart.manualProxy || {};
      const services = restart.aiproxyServices || {};
      const parts = ['配置检查通过'];
      if (manual.matched) parts.push(`手动进程 ${manual.matched} 个，已启动 ${(manual.started || []).length} 个`);
      if (services.matched) {
        const restarted = (services.items || []).filter(item => item.restarted).length;
        const inactive = (services.items || []).filter(item => item.skipped === 'inactive').length;
        parts.push(`systemd 服务 ${services.matched} 个，重启 ${restarted} 个${inactive ? `，未运行 ${inactive} 个` : ''}`);
      }
      if (!manual.matched && !services.matched) parts.push('未发现当前配置对应的运行中 AIProxy，无需自动重启');
      return parts.join('；');
    }

    function providerBaseUrl(provider) {
      return String(provider?.base_url || provider?.url || '').trim();
    }

    function providerApiKey(provider) {
      return String(provider?.api_key || provider?.key || '').trim();
    }

    function modelSummary(provider) {
      const rows = modelsToRows(provider?.models || provider?.model);
      if (!rows.length) return { text: '0', title: '未配置模型' };
      const first = rows[0].name || '-';
      const text = rows.length === 1 ? first : `${first} +${rows.length - 1}`;
      const title = rows.map(row => {
        const meta = [];
        if (row.context) meta.push(`ctx ${row.context}`);
        if (row.effort) meta.push(`reasoning ${row.effort}`);
        return meta.length ? `${row.name} (${meta.join(', ')})` : row.name;
      }).join('\n');
      return { text, title };
    }

    function keepaliveBadge(provider) {
      if (!provider || provider.keepalive !== true) return '';
      const entry = (state.keepalive && state.keepalive.providers || {})[provider.name];
      if (!entry) return '<span class="status muted" title="aiproxy 尚未上报该 provider 的保活状态；保存配置会自动重启 aiproxy">待启动</span>';
      const detail = [];
      if (entry.lastError) detail.push(entry.lastError);
      if (entry.note) detail.push(entry.note);
      if (entry.latencyMs != null) detail.push(entry.latencyMs + 'ms');
      const title = esc(detail.join(' | '));
      if (entry.state === 'warm') return `<span class="status ok" title="${title}">🟢 保活</span>`;
      if (entry.state === 'failed') return `<span class="status fail" title="${title}">🔴 失败</span>`;
      if (entry.state === 'stopped') return `<span class="status muted" title="${title}">保活已停</span>`;
      return `<span class="status warn" title="${title}">🟡 抢通</span>`;
    }

    function renderProviderRows() {
      let regularNo = 0;
      $('providerRows').innerHTML = state.providers.map((p, i) => {
        const models = modelSummary(p);
        const baseUrl = providerBaseUrl(p);
        const uaLabel = providerUaLabel(p);
        const displayNo = isPinnedProvider(p) ? '置顶' : String(++regularNo);
        const providerBadges = [
          p.enabled === false ? '<span class="status muted">停用</span>' : '',
          providerApiKey(p) ? '' : '<span class="status warn">无Key</span>',
          keepaliveBadge(p)
        ].filter(Boolean).join(' ');
        return `
        <tr>
          <td>${displayNo}</td>
          <td class="truncate" title="${esc(p.name || '')}">${esc(p.name)}${providerBadges ? ' ' + providerBadges : ''}</td>
          <td class="truncate" title="${esc(baseUrl)}">${esc(baseUrl)}</td>
          <td class="truncate" title="${esc(endpointLabel(p.api_mode || 'codex_responses', p))}">${esc(endpointLabel(p.api_mode || 'codex_responses', p))}</td>
          <td class="truncate" title="${esc(uaLabel)}">${esc(uaLabel)}</td>
          <td class="truncate" title="${esc(models.title)}">${esc(models.text)}</td>
          <td><div class="row-tools"><button class="${state.selectedProvider === i ? 'danger' : ''}" data-edit-provider="${i}" type="button">${state.selectedProvider === i ? '取消' : '编辑'}</button><button data-clone-provider="${i}" type="button">克隆</button><button data-toggle-provider="${i}" type="button">${p.enabled === false ? '启用' : '停用'}</button><button class="danger" data-delete-provider="${i}" type="button">删除</button></div></td>
        </tr>`;
      }).join('') || `<tr><td colspan="7"><div class="empty">暂无 provider</div></td></tr>`;
    }

    function renderProviders() {
      renderProviderRows();
      renderSaveResult();
      renderProviderEditor();
    }

    function maskKey(key) {
      if (!key) return '';
      if (key.length <= 12) return '*'.repeat(key.length);
      return `${key.slice(0, 6)}......${key.slice(-4)}`;
    }

    function headerValue(headers, name) {
      const wanted = String(name || '').toLowerCase();
      const key = Object.keys(headers || {}).find(k => String(k).toLowerCase() === wanted);
      return key === undefined ? undefined : headers[key];
    }

    function providerUaLabel(provider) {
      const headers = provider?.headers || {};
            const ua = headerValue(headers, 'User-Agent');
      const originator = String(headerValue(headers, 'Originator') || '').toLowerCase();
      const xApp = String(headerValue(headers, 'x-app') || '').toLowerCase();
      const uaText = String(ua ?? '');
      const uaLower = uaText.toLowerCase();
      if (originator === 'codex_cli_rs' || uaLower.includes('codex_cli_rs')) return 'Codex';
      if (xApp === 'cli' || uaLower.includes('claude-code/') || uaLower.includes('claude-cli')) return 'Claude Code';
      if (ua === '') return 'Empty';
      if (uaText === 'curl/8.0' || uaLower.startsWith('curl/')) return 'Curl';
      if (uaLower.includes('mozilla/5.0') || uaLower.includes('chrome/') || uaLower.includes('applewebkit/')) return 'Chrome';
      if (typeof ua === 'string') return ua || 'Empty';
      return 'Default';
    }

    function endpointLabel(value, provider = {}) {
      if (value === 'custom_endpoint') {
        const endpoint = provider.custom_endpoint || provider.endpoint || 'Custom';
        return endpoint;
      }
      if (value === 'chat_completions' || value === 'chat') return '/chat/completions';
      if (value === 'messages') return '/messages';
      if (value === 'codex_responses' || value === 'responses') return '/responses';
      return value || '';
    }

    function normalizeEndpointMode(value) {
      const mode = String(value || '').trim();
      if (mode === 'chat') return 'chat_completions';
      if (mode === 'responses') return 'codex_responses';
      if (['codex_responses', 'chat_completions', 'messages', 'custom_endpoint'].includes(mode)) return mode;
      return 'codex_responses';
    }

    function normalizeEndpoint(value) {
      const endpoint = String(value || '').trim();
      if (!endpoint) return '';
      return endpoint.startsWith('/') ? endpoint : `/${endpoint}`;
    }

    function updateCustomEndpointInput() {
      const input = $('providerCustomEndpoint');
      if (!input) return;
      input.hidden = $('providerMode').value !== 'custom_endpoint';
    }

    function modelsToRows(models) {
      if (typeof models === 'string') return models.trim() ? [{ name: models, context: '', effort: '' }] : [];
      if (Array.isArray(models)) return models.map(name => String(name).trim()).filter(Boolean).map(name => ({ name, context: '', effort: '' }));
      if (models && typeof models === 'object') {
        return Object.entries(models).filter(([name]) => String(name).trim()).map(([name, meta]) => ({
          name,
          context: meta?.context_length || meta?.max_model_len || meta?.max_tokens || '',
          effort: meta?.reasoning_effort || meta?.reasoning || ''
        }));
      }
      return [];
    }

    function rowsToModels() {
      const models = {};
      document.querySelectorAll('[data-model-row]').forEach(row => {
        const name = row.querySelector('[data-model-name]').value.trim();
        if (!name) return;
        const context = row.querySelector('[data-model-context]').value.trim();
        const effort = row.querySelector('[data-model-effort]').value;
        const contextValue = Number(context);
        models[name] = {};
        if (context && Number.isFinite(contextValue) && contextValue > 0) models[name].context_length = contextValue;
        if (effort) models[name].reasoning_effort = effort;
      });
      return models;
    }

    function renderModelRows(models) {
      const rows = modelsToRows(models);
      $('modelRows').innerHTML = rows.map((row, i) => modelRowHtml(row, i)).join('');
    }

    function modelRowHtml(row, i) {
      return `<div class="mini-row" data-model-row="${i}"><input data-model-name value="${esc(row.name || '')}" placeholder="模型名称"><input data-model-context type="number" min="0" step="100000" value="${esc(row.context || '')}" placeholder="上下文"><select data-model-effort><option value="">默认</option>${['minimal','low','medium','high','xhigh','max','none'].map(v => `<option value="${v}" ${row.effort === v ? 'selected' : ''}>${v}</option>`).join('')}</select><button data-remove-model="${i}" type="button">x</button></div>`;
    }

    function renderModelChoices(models) {
      state.fetchedModels = models || [];
      $('modelChoices').hidden = !state.fetchedModels.length;
      $('addSelectedModelsBtn').hidden = !state.fetchedModels.length;
      $('modelChoices').innerHTML = state.fetchedModels.map((model, i) => `<label class="model-choice"><input type="checkbox" data-model-choice="${i}"><span class="truncate" title="${esc(model.id)}">${esc(model.id)}</span><span class="subtle">${esc(model.context_length || '')}</span></label>`).join('');
    }

    function clearFetchedModels() {
      state.fetchedModels = [];
      $('modelFetchStatus').textContent = '';
      $('modelChoices').innerHTML = '';
      $('modelChoices').hidden = true;
      $('addSelectedModelsBtn').hidden = true;
    }

    function addFetchedModelsToRows() {
      const existing = new Set([...document.querySelectorAll('[data-model-name]')].map(input => input.value.trim()).filter(Boolean));
      const chosen = [...document.querySelectorAll('[data-model-choice]:checked')].map(input => state.fetchedModels[Number(input.dataset.modelChoice)]).filter(Boolean);
      for (const model of chosen) {
        if (existing.has(model.id)) continue;
        $('modelRows').insertAdjacentHTML('beforeend', modelRowHtml({ name: model.id, context: model.context_length || '', effort: '' }, Date.now() + Math.random()));
        existing.add(model.id);
      }
    }

    const chromeUserAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36';
    const codexUserAgent = 'codex_cli_rs/0.139.0 (Ubuntu 24.04 LTS; x86_64) xterm-256color';
    const claudeCodeUserAgent = 'claude-code/2.1.153 (linux; x64; node/v24.16.0)';
    const uaRelatedHeaders = new Set(['user-agent', 'originator', 'x-app']);

    function detectHeaderPreset(provider) {
      const headers = provider?.headers || {};
      const ua = headerValue(headers, 'User-Agent');
      const originator = String(headerValue(headers, 'Originator') || '').toLowerCase();
      const xApp = String(headerValue(headers, 'x-app') || '').toLowerCase();
      const uaText = String(ua ?? '');
      const uaLower = uaText.toLowerCase();
      if (originator === 'codex_cli_rs' || uaLower.includes('codex_cli_rs')) return 'codex';
      if (uaText === claudeCodeUserAgent || uaLower.includes('claude-code/') || (xApp === 'cli' && uaLower.includes('claude-cli'))) return 'claude_code';
      if (ua === '') return 'empty';
      if (uaText === 'curl/8.0' || uaLower.startsWith('curl/')) return 'curl';
      if (uaText === chromeUserAgent || uaLower.includes('mozilla/5.0') || uaLower.includes('chrome/') || uaLower.includes('applewebkit/')) return 'chrome';
      if (typeof ua === 'string') return 'custom';
      return 'default';
    }

    function customUaValue(provider) {
      const ua = headerValue(provider?.headers || {}, 'User-Agent');
      return typeof ua === 'string' ? ua : '';
    }

    function updateCustomUaInput() {
      const input = $('headerCustomUa');
      if (!input) return;
      input.hidden = $('headerPreset').value !== 'custom';
    }

    function baseHeaderConfig(provider) {
      const headers = {};
      Object.entries(provider?.headers || {}).forEach(([key, value]) => {
        if (!uaRelatedHeaders.has(String(key).toLowerCase())) headers[key] = value;
      });
      const remove_headers = (provider?.remove_headers || []).filter(key => String(key || '').toLowerCase() !== 'user-agent');
      return { headers, remove_headers };
    }

    function presetToHeaders(preset, customUa = '', provider = null) {
      const config = baseHeaderConfig(provider);
      if (preset === 'empty') return { headers: { ...config.headers, 'User-Agent': '' }, remove_headers: config.remove_headers };
      if (preset === 'curl') return { headers: { ...config.headers, 'User-Agent': 'curl/8.0' }, remove_headers: config.remove_headers };
      if (preset === 'chrome') return { headers: { ...config.headers, 'User-Agent': chromeUserAgent }, remove_headers: config.remove_headers };
      if (preset === 'codex') return { headers: { ...config.headers, Originator: 'codex_cli_rs', 'User-Agent': codexUserAgent }, remove_headers: config.remove_headers };
      if (preset === 'claude_code') return { headers: { ...config.headers, 'User-Agent': claudeCodeUserAgent }, remove_headers: config.remove_headers };
      if (preset === 'custom') return { headers: customUa ? { ...config.headers, 'User-Agent': customUa } : config.headers, remove_headers: config.remove_headers };
      return config;
    }

    function renderProviderEditor() {
      const p = state.providers[state.selectedProvider];
      clearFetchedModels();
      $('providerEditorTitle').textContent = 'Provider编辑';
      const pinned = isPinnedProvider(p);
      setProviderPinnedButton(pinned, pinnedAtValue(p) || '');
      $('providerNo').value = pinned ? '' : (p ? regularProviderNo(state.selectedProvider) : 1);
      $('providerNo').max = Math.max(regularProviderCount(), 1);
      $('providerName').value = p?.name || '';
      $('providerBaseUrl').value = providerBaseUrl(p);
      $('providerApiKey').value = providerApiKey(p);
      $('providerMode').value = normalizeEndpointMode(p?.api_mode);
      $('providerCustomEndpoint').value = p?.custom_endpoint || '';
      $('providerStreamMaxRetries').value = providerRetryValue(p, 'stream_max_retries', CODEX_STREAM_MAX_RETRIES_DEFAULT);
      $('providerStreamMaxRetries').dataset.autoDefault = hasRetryConfig(p, 'stream_max_retries') ? '0' : '1';
      $('providerKeepaliveConcurrency').value = Number(p?.keepalive_concurrency || KEEPALIVE_CONCURRENCY_DEFAULT);
      $('providerKeepaliveRetryInterval').value = Number(
        p?.keepalive_retry_interval || KEEPALIVE_RETRY_INTERVAL_DEFAULT
      );
      $('providerKeepaliveInterval').value = Number(p?.keepalive_interval || KEEPALIVE_INTERVAL_DEFAULT);
      setProviderKeepaliveEnabled(p?.keepalive === true);
      updateCustomEndpointInput();
      if (p) {
        renderModelRows(p.models || {});
      } else {
        $('modelRows').innerHTML = '';
      }
      const headerPreset = detectHeaderPreset(p);
      $('headerPreset').value = headerPreset;
      $('headerCustomUa').value = headerPreset === 'custom' ? customUaValue(p) : '';
      updateCustomUaInput();
    }

    function authModeForEndpoint(endpointMode, customEndpoint = '') {
      if (endpointMode === 'messages') return 'anthropic';
      if (endpointMode === 'custom_endpoint' && customEndpoint === '/messages') return 'anthropic';
      return 'bearer';
    }

    function collectProviderEditor() {
      const headerPreset = $('headerPreset').value;
      const customUa = $('headerCustomUa').value.trim();
      const endpointMode = normalizeEndpointMode($('providerMode').value);
      const customEndpoint = normalizeEndpoint($('providerCustomEndpoint').value);
      const providerName = $('providerName').value.trim();
      if (headerPreset === 'custom' && !customUa) throw new Error('Custom User-Agent is required');
      if (endpointMode === 'custom_endpoint' && !customEndpoint) throw new Error('自定义 Endpoint 必填');
      if (customEndpoint === '/message') throw new Error('Endpoint must be /messages, not /message');
      const headerConfig = presetToHeaders(headerPreset, customUa, state.providers[state.selectedProvider] || {});
      const pinned = providerPinnedFromEditor();
      const item = {
        ...(state.providers[state.selectedProvider] || {}),
        name: providerName,
        base_url: $('providerBaseUrl').value.trim(),
        api_key: $('providerApiKey').value.trim(),
        api_mode: endpointMode,
        auth_mode: authModeForEndpoint(endpointMode, customEndpoint),
        enabled: state.providers[state.selectedProvider]?.enabled !== false,
        pinned,
        models: rowsToModels(),
        headers: headerConfig.headers,
        remove_headers: headerConfig.remove_headers,
        stream_max_retries: collectRetryInput('providerStreamMaxRetries', 'stream_max_retries', CODEX_STREAM_MAX_RETRIES_DEFAULT)
      };
      if (pinned) item.pinned_at = providerPinnedAtFromEditor();
      else delete item.pinned_at;
      if (endpointMode === 'custom_endpoint') item.custom_endpoint = customEndpoint;
      else delete item.custom_endpoint;
      return compactProviderForPersist(item);
    }

    function saveRestartText(restart) {
      if (!restart || restart.ok !== false) return '';
      if (restart.configCheck && restart.configCheck.ok === false) return '，AIProxy 未重启：配置检查失败';
      if (restart.skipped) return '，AIProxy 未重启';
      return '，AIProxy 重启失败，请到 AIProxy 页查看';
    }

    async function persistProviders() {
      const providers = state.providers.filter(provider => !provider.__draft).map(providerForPersist);
      const data = await api('/config', { method: 'POST', body: JSON.stringify({ providers, format: 'yaml' }) });
      const warningText = data.warnings?.length ? `，警告 ${data.warnings.length} 条：${data.warnings.slice(0, 2).join('；')}${data.warnings.length > 2 ? '…' : ''}` : '';
      const restartText = saveRestartText(data.restart);
      state.lastSaveDetails = data;
      state.lastSaveMessage = `配置已保存${warningText}${restartText}`;
      $('serverState').textContent = state.lastSaveMessage;
      renderSaveResult();
      return data;
    }

    async function saveCurrent() {
      if (state.tab === 'config') {
        if (state.selectedProvider >= 0) {
          const provider = collectProviderEditor();
          if (!provider.name || !provider.base_url) throw new Error('名称和 Base URL 必填');
          const current = state.providers[state.selectedProvider];
          const maxNo = regularProviderCount() + (isPinnedProvider(current) && !isPinnedProvider(provider) ? 1 : 0);
          upsertProviderAtNo(provider, providerTargetNo(maxNo));
        }
        await persistProviders();
      }
      await loadAll();
    }

    function aiproxyHealthLabel(item) {
      if (item.health === 'healthy') return '健康';
      if (item.health === 'unhealthy') return '异常';
      if (item.health === 'starting') return '启动中';
      if (item.health === 'stopped') return '已停止';
      return '未知';
    }

    function aiproxyHealthKind(item) {
      if (item.health === 'healthy') return 'ok';
      if (item.health === 'unhealthy') return 'fail';
      if (item.health === 'starting') return 'warn';
      if (item.health === 'stopped') return 'muted';
      return 'warn';
    }

    function renderAiproxy() {
      const containers = ['aiproxyRows', 'aiproxyPageRows'].map(id => $(id)).filter(Boolean);
      if (!containers.length) return;
      const items = state.aiproxy.items || [];
      const errorHtml = state.aiproxy.error ? `<div class="note">AIProxy 状态读取失败：${esc(state.aiproxy.error)}</div>` : '';
      if (!items.length) {
        const html = errorHtml || `<div class="empty">未发现 AIProxy systemd 服务</div>`;
        containers.forEach(container => { container.innerHTML = html; });
        return;
      }
      const html = errorHtml + items.map((item, i) => {
        const id = item.id || '';
        const name = item.name || item.service || id;
        const latency = Number.isFinite(Number(item.httpLatencyMs)) ? ` · ${Number(item.httpLatencyMs)}ms` : '';
        const httpText = item.httpAlive ? `HTTP 响应${latency}` : (item.httpTransient ? `探测重试中${latency}` : (item.httpDetail || 'HTTP 未通'));
        const httpKind = item.httpAlive ? '' : (item.httpTransient ? 'warn' : 'fail');
        const activeText = item.active || 'unknown';
        const url = item.url || '';
        return `<article class="service-card">
          <div class="service-title">
            <strong title="${esc(name)}">${esc(name)}</strong>
            ${statusPill(null, aiproxyHealthLabel(item), aiproxyHealthKind(item))}
          </div>
          <div class="service-health">
            ${statusPill(!!item.activeOk, activeText)}
            <span title="${esc(item.httpDetail || httpText)}">${statusPill(item.httpAlive ? true : false, httpText, httpKind)}</span>
          </div>
          <div class="service-meta">
            <div title="${esc(item.service || '')}">服务：${esc(item.service || '-')}</div>
            <div title="${esc(url)}">地址：${esc(url || '-')}</div>
            <div title="${esc(item.config || '')}">配置：${esc(item.config || '-')}</div>
            <div title="${esc(item.unitPath || '')}">Unit：${esc(item.unitPath || '-')}</div>
          </div>
          <div class="service-actions">
            <button data-edit-aiproxy="${i}" type="button">编辑</button>
            <button data-aiproxy-action="start" data-aiproxy-id="${esc(id)}" type="button">启动</button>
            <button data-aiproxy-action="stop" data-aiproxy-id="${esc(id)}" type="button">停止</button>
            <button data-aiproxy-action="restart" data-aiproxy-id="${esc(id)}" type="button">重启</button>
          </div>
        </article>`;

      containers.forEach(container => { container.innerHTML = html; });
