# 示例配置文件：请复制为 config/config.yaml 后填入你自己的 Provider 信息。
#
# 注意：公开仓库不要提交真实 config.yaml、真实 Provider 域名、真实 API Key、
# 运行状态文件或测活结果。

providers:
  - name: provider-a
    base_url: https://example-a.invalid/v1
    api_key: ${PROVIDER_A_API_KEY}
    api_mode: codex_responses
    stream_max_retries: 5
    models:
      gpt-5.5:
        context_length: 400000
        reasoning_effort: high
        # 可选：统计估价，单位为 USD / 1,000,000 tokens；不配置则显示未定价。
        # pricing:
        #   input_per_million: 1
        #   output_per_million: 2
        #   cache_read_per_million: 0.1
        #   cache_creation_per_million: 0.5
    headers: {}
    enabled: true
    # 抢通 + 保温（默认关闭，不写这几行就是关）。默认 HTTP 模式在启动时并发抢一条
    # 可用上游连接，赢家留在连接池里，之后每 keepalive_interval 秒发一句很短的轮换
    # 提示词把它焐热；状态见 GET /_keepalive 或 dashboard 的 provider 列表 badge。
    # 只有 keepalive 在维护页有勾选框，其余是 config-only 高级项。
    # 成本：每个开启的 provider 每天约 86400/keepalive_interval 次短请求，别全开。
    keepalive: false
    # keepalive_backend: http       # 默认 HTTP；codex_cli 使用独立交互式 Codex 会话
    # keepalive_codex_path: codex   # codex_cli 模式下的可执行文件名或绝对路径
    # codex_cli 仅支持原生 Responses + Bearer，不支持 remove_headers；需要本机安装 Codex。
    # 它继承当前 keepalive_model 的推理深度，再回退到 Provider 级配置；未设置则用 CLI 默认。
    # keepalive_reasoning_effort / keepalive_max_output_tokens 仅控制 HTTP 模式，不覆盖 CLI 配置。
    # keepalive_interval: 60        # 保活间隔秒数，5~3600
    # keepalive_concurrency: 10     # 冷启动抢通并发，1~50；保温 miss 后重抢固定为 1
    # keepalive_retry_interval: 5   # 整轮抢通失败后等待秒数，1~3600
    # keepalive_retry_jitter: 0     # 重试抖动比例，0~1；默认 0，不改变固定间隔行为
    # keepalive_timeout: 60         # SSE 连续无数据的读取超时秒数，5~600
    # keepalive_first_event_timeout: 30 # 首个 SSE 事件最长等待秒数，5~600
    # keepalive_idle_timeout: 60    # SSE 两个事件之间最长空闲秒数，5~600
    # keepalive_total_timeout: 180  # 每次探测总期限（含等并发名额/HTTP读写），5~1800；
                                   # 到期释放连接后正常重试，不限制真实业务回复。
                                   # 系统 DNS 解析无法由 Python 强制打断；迟到的连接不会发送探测。
    # keepalive_reasoning_effort: medium  # 仅 HTTP 模式的探测专用推理强度
    # keepalive_max_output_tokens: 32     # 探测输出上限；命中上限的 incomplete 也算通
    # keepalive_model: ''           # 留空取 models 第一个
    # keepalive_max_attempts: 0     # 0 = 不限制可重试错误的轮数
    # 明确的凭据失效、余额不足、模型/参数错误会停止抢通；修正后关闭再开启 keepalive。
    # 限流、临时无通道，以及没有明确永久错误证据的 403/404 仍按原间隔重试。

  - name: provider-b
    base_url: https://example-b.invalid/v1
    api_key: ${PROVIDER_B_API_KEY}
    # chat_completions 表示上游只有 /chat/completions；Codex 仍然访问本地
    # /{provider}/v1/responses，proxy.py 会自动做 Responses ↔ Chat 转换，
    # 包括 function_call/function_call_output ↔ tool_calls/tool 消息以及流式工具参数事件。
    api_mode: chat_completions
    stream_max_retries: 5
    models:
      gpt-5.5:
        context_length: 400000
        reasoning_effort: high
    headers:
      User-Agent: ''
    enabled: true

  - name: provider-c
    base_url: https://example-c.invalid/v1
    api_key: ${PROVIDER_C_API_KEY}
    api_mode: codex_responses
    stream_max_retries: 5
    models:
      gpt-5.5:
        context_length: 400000
        reasoning_effort: high
      glm-5.1:
        context_length: 200000
    headers:
      Originator: codex_cli_rs
      User-Agent: codex_cli_rs/0.139.0 (Debian 12.0.0; x86_64) xterm-256color
    enabled: false
